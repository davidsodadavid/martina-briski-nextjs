name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; queue instead of cancelling so a deploy is never half-applied
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Dummy — the build must not touch a database (all DB pages are force-dynamic)
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      # NEXT_PUBLIC_* vars are inlined into the client bundle at build time,
      # so this has to be set here — setting it only in the server's runtime
      # env (like the other secrets) would leave it undefined in production.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Assemble standalone artifact
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          RELEASE=${GITHUB_SHA::8}
          rsync -az --delete .next/standalone/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/martina/releases/$RELEASE/"

      - name: Run database migrations (via SSH tunnel)
        env:
          # postgresql://martina:<password>@localhost:5433/martina_blog — port 5433 is the tunnel below
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          ssh -f -N -L 5433:localhost:5432 \
            -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"

          # One-time recovery: a previous deploy failed partway through making
          # Ebook.slug required, because existing rows had no slug yet.
          # Backfill them, then tell Prisma to retry that migration.
          # TODO: remove these two lines once the next deploy succeeds.
          echo "UPDATE \"Ebook\" SET slug = lower(regexp_replace(trim(title), '[^a-zA-Z0-9]+', '-', 'g')) || '-' || substr(id, 1, 6) WHERE slug IS NULL;" | pnpm exec prisma db execute --stdin
          pnpm exec prisma migrate resolve --rolled-back 20260729165626_make_ebook_slug_required || true

          pnpm exec prisma migrate deploy

      - name: Activate release
        run: |
          RELEASE=${GITHUB_SHA::8}
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            ln -sfn /srv/martina/releases/$RELEASE /srv/martina/current &&
            pm2 startOrReload /srv/martina/ecosystem.config.js &&
            pm2 save &&
            cd /srv/martina/releases && ls -1t | tail -n +4 | xargs -r rm -rf --
          "
